<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KNOW. - 参加者ビュー</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background-color: #009D4E;
  background-size: 60px 60px;
  background-image: 
    linear-gradient(to right, rgba(255, 255, 255, 0.2) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255, 255, 255, 0.2) 1px, transparent 1px);
  color: white;
  font-family: sans-serif;
}

header {
  text-align: center;
  padding: 20px;
}

h1 {
  margin: 0;
}

h1 img {
  max-width: 100%;
  height: auto;
}

.score {
  background: #202f45;
  border-radius: 12px;
  padding: 20px;
  text-align: center;
  margin-bottom: 25px;
}

.score strong {
  display: block;
  font-size: 36px;
  color: #ffd166;
}

.board {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 25px;
}

.category {
  text-align: center;
  color: #62b5ff;
  margin: 25px 0 12px;
}

/* 参加者画面のタイルはクリック不可にするためカーソルをデフォルトに */
.tile {
  background: #245b91;
  color: white;
  border: none;
  border-radius: 12px;
  padding: 25px 5px;
  font-size: 23px;
  font-weight: bold;
  cursor: default;
}

.tile.opened {
  background: #394252;
  color: #8993a2;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.85);
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.modal-content {
  background: #202f45;
  border: 1px solid #62b5ff;
  border-radius: 18px;
  padding: 25px;
  width: 100%;
  max-width: 450px;
  text-align: center;
}

.question {
  font-size: 21px;
  margin: 25px 0;
}

button {
  cursor: pointer;
}

.action {
  border: none;
  border-radius: 9px;
  padding: 13px 18px;
  margin: 5px;
  font-size: 15px;
}

.close {
  background: #596579;
  color: white;
  width: 100%;
}
</style>
</head>

<body>

<header>
  <h1>
    <img src="titlelogo_white.png" alt="KNOW.">
  </h1>
  <p>I KNOW. DO YOU? (Participant View)</p>
</header>

<div class="score">
  YOUR SCORE
  <strong id="score">0</strong>
  POINTS
</div>

<h2 class="category">📚 雑学</h2>
<div class="board" id="trivia"></div>

<h2 class="category">🌎 常識</h2>
<div class="board" id="general"></div>

<!-- 問題表示用モーダル（司会者が開いたときに連動して表示される） -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h2 id="questionTitle">QUESTION</h2>
    <div class="question" id="question">ここに問題文が表示されます</div>
    <button class="action close" onclick="closeModal()">
      閉じる（手元で非表示にする）
    </button>
  </div>
</div>

<script>
// 司会者側と同じ問題データ（表示同期用）
const questions = {
  trivia: [
    { point: 10, q: "タコの足は何本？" },
    { point: 20, q: "パンダの主食は何？" },
    { point: 30, q: "世界で最も面積が大きい国は？" }
  ],
  general: [
    { point: 10, q: "日本の首都は？" },
    { point: 20, q: "1年は何か月？" },
    { point: 30, q: "日本で一番高い山は？" }
  ]
};

// ボードの初期描画（参加者はクリックしても反応しない）
function createBoard() {
  for (const category in questions) {
    const board = document.getElementById(category);
    questions[category].forEach((item) => {
      const div = document.createElement("div");
      div.className = "tile";
      div.textContent = item.point + "点";
      board.appendChild(div);
    });
  }
}

// 参加者が手元でモーダルを閉じる関数（問題文を一時的に引っ込める用）
function closeModal() {
  document.getElementById("modal").style.display = "none";
}

createBoard();
</script>

</body>
</html>
