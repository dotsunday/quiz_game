
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KNOW. - Player</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px 10px;
  background-color: #009D4E;
  background-image:
    linear-gradient(to right, rgba(255,255,255,0.15) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,0.15) 1px, transparent 1px);
  background-size: 60px 60px;
  color: #1a1a1a;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.container {
  max-width: 600px;
  margin: 0 auto;
  background: #fcfbf9;
  border: 2px solid #1a1a1a;
  border-radius: 4px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.15);
  overflow: hidden;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px;
  border-bottom: 2px solid #1a1a1a;
  background: #fff;
  gap: 10px;
}

header img {
  width: 120px;
  max-width: 100%;
  height: auto;
}

header p {
  margin: 0;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.08em;
}

main {
  padding: 20px;
}

.content-divider {
  display: flex;
  align-items: center;
  margin: 15px 0 25px;
}

.content-divider::before,
.content-divider::after {
  content: "";
  flex: 1;
  border-bottom: 2px solid #1a1a1a;
}

.content-badge {
  padding: 7px 20px;
  border: 2px solid #1a1a1a;
  border-radius: 50px;
  background: #fff;
  font-size: 0.8rem;
  font-weight: 800;
  letter-spacing: 0.12em;
}

.label {
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.1em;
  margin-bottom: 8px;
}

input {
  width: 100%;
  padding: 14px;
  border: 2px solid #1a1a1a;
  border-radius: 2px;
  background: #fff;
  font-size: 1rem;
  margin-bottom: 18px;
}

button {
  cursor: pointer;
  font-family: inherit;
}

.main-button {
  width: 100%;
  padding: 15px;
  border: 2px solid #1a1a1a;
  background: #009D4E;
  color: #fff;
  font-size: 1rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  box-shadow: 0 4px 0 #1a1a1a;
}

.main-button:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 #1a1a1a;
}

.note {
  margin-top: 20px;
  font-size: 0.75rem;
  color: #777;
  line-height: 1.6;
  text-align: center;
}

#gameScreen {
  display: none;
}

.player-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  background: #1a1a1a;
  color: #fff;
  padding: 15px;
  margin-bottom: 20px;
}

.player-info small {
  color: #aaa;
  display: block;
  font-size: 0.7rem;
  letter-spacing: 0.1em;
}

.player-info strong {
  font-size: 1.3rem;
}

.score {
  color: #ffd166;
  font-family: monospace;
  font-size: 1.5rem;
}

.question-box {
  border: 2px solid #1a1a1a;
  background: #fff;
  padding: 20px;
  text-align: center;
  margin-bottom: 20px;
}

.question-box small {
  font-weight: 800;
  letter-spacing: 0.12em;
  color: #777;
}

.question-box h2 {
  font-size: 1.2rem;
  line-height: 1.6;
  margin: 15px 0 5px;
}

.waiting {
  padding: 25px 15px;
  background: #eeece7;
  border: 1px dashed #aaa;
  text-align: center;
  line-height: 1.7;
  font-size: 0.9rem;
}

.waiting strong {
  display: block;
  font-size: 1.1rem;
  margin-bottom: 8px;
}

.buzzer {
  width: 100%;
  padding: 22px 10px;
  border: 3px solid #1a1a1a;
  border-radius: 3px;
  background: #d90429;
  color: #fff;
  font-size: 1.4rem;
  font-weight: 900;
  letter-spacing: 0.1em;
}

.buzzer:disabled {
  background: #aaa;
  border-color: #888;
  cursor: default;
}

.choices {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 15px;
}

.choice {
  padding: 16px 8px;
  border: 2px solid #1a1a1a;
  background: #fff;
  font-size: 0.95rem;
  font-weight: 700;
}

.choice:disabled {
  opacity: 0.5;
  cursor: default;
}

footer {
  padding: 15px;
  border-top: 2px solid #1a1a1a;
  text-align: center;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.1em;
}

@media (max-width: 400px) {
  header img {
    width: 100px;
  }

  header p {
    font-size: 0.65rem;
  }

  main {
    padding: 15px;
  }
}

.room-reset-area {
  display: flex;
  justify-content: flex-end;
  margin: 12px 0 20px;
}

.room-reset-button {
  padding: 10px 16px;
  border: 1px solid #1a1a1a;
  border-radius: 4px;
  background: #fff;
  color: #1a1a1a;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="container">

  <header>
    <img src="titlelogo_black_nyan.png" alt="KNOW.">
    <p>I KNOW. DO YOU?</p>
  </header>

  <main>

    <!-- 入室画面 -->
    <section id="joinScreen">

      <div class="content-divider">
        <span class="content-badge">PLAYER ENTRY</span>
      </div>

<p class="label">ROOM CODE / 参加コード</p>
<input
  id="roomCode"
  type="text"
  placeholder="数字6桁"
>
      <p class="label">YOUR NAME / ニックネーム</p>
      <input
        id="playerName"
        type="text"
        placeholder="12文字以内"
        maxlength="12"
      >

      <button class="main-button" onclick="joinGame()">
        JOIN THE GAME →
      </button>

    </section>

    <!-- ゲーム画面 -->
    <section id="gameScreen">

      <div class="content-divider">
        <span class="content-badge">PLAYER ROOM</span>
      </div>

      <div class="player-info">
        <div>
          <small>PLAYER</small>
          <strong id="displayName">PLAYER</strong>
        </div>
        <div style="text-align:right;">
          <small>YOUR SCORE</small>
          <strong class="score" id="displayScore">0 pts</strong>
        </div>
      </div>

      <div class="question-box">
        <small id="questionCategory">WAITING FOR QUESTION</small>
        <h2 id="questionText">
          ホストが問題を選ぶのを待っています
        </h2>
      </div>

<div id="turnMessage" style="
  display:none;
  padding:15px;
  margin-bottom:15px;
  background:#ffd166;
  border:2px solid #1a1a1a;
  text-align:center;
  font-weight:900;
">
  あなたの回答番です！
</div>

      <div class="waiting" id="waitingMessage">
        <strong>//STAY TUNED//</strong>
        次の問題が出題されるまで<br>
        しばらくお待ちください
      </div>

      <div id="answerArea" style="display:none;">

      <button class="buzzer" id="buzzerButton" onclick="pressBuzzer()" disabled>
  BUZZER !
</button>

        <div class="choices">
          <button class="choice" disabled>CHOICE A</button>
          <button class="choice" disabled>CHOICE B</button>
          <button class="choice" disabled>CHOICE C</button>
          <button class="choice" disabled>CHOICE D</button>
        </div>

      </div>

      <p class="note">
        ※ 現在は画面確認用です。<br>
        司会者との連動機能はこれから追加します。
      </p>

<div class="room-reset-area">
  <button type="button" onclick="resetRoom()" class="room-reset-button">
    別のルームに参加する
  </button>
</div>
    </section>

  </main>

  <footer>
    KNOW.
  </footer>

</div>

<script>
// Supabase接続設定
const SUPABASE_URL = "https://jdzrpditjbcnbavpadjp.supabase.co";

// 司会者ページと同じ公開用キーを設定
const SUPABASE_KEY = "sb_publishable_9GfTenwqD00b3hU4aBm3Mg_T2t8R6hC";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

// 現在参加しているルーム
let playerRoomId = null;

// 自分の参加者ID
let currentPlayerId = null;

// ルームの更新を監視するチャンネル
let playerRoomChannel = null;

// 得点の更新を監視するチャンネル
let playerScoreChannel = null;

// 現在の問題番号
let currentQuestionNumber = null;

// 自分の早押し順位
let myBuzzOrder = null;

// ジャンル名を日本語に変換
const categoryNames = {
  language: "文学",
  trivia: "雑学",
  culture: "文化・芸術",
  anime: "アニメ",
  net: "ネットスラング"
};

async function watchRoom(roomCode) {
  const { data: room, error } = await supabaseClient
    .from("rooms")
    .select("id, status, current_question_number, current_question_text, current_question_category, current_points, question_status, buzz_open, current_answer_player_id, current_turn_index")
    .eq("room_code", roomCode)
    .single();

  if (error) {
    console.error("ルーム情報取得エラー:", error);
    alert("ルーム情報を取得できませんでした。");
    return;
  }

  playerRoomId = room.id;

  const { data: userData, error: userError } =
    await supabaseClient.auth.getUser();

  if (userError) throw userError;

  const { data: player, error: playerError } = await supabaseClient
    .from("players")
    .select("id")
    .eq("room_id", playerRoomId)
    .eq("user_id", userData.user.id)
    .single();

  if (playerError) throw playerError;

  currentPlayerId = player.id;

  await updateQuestionScreen(room);
  await loadMyScore();

  if (playerRoomChannel) {
    await supabaseClient.removeChannel(playerRoomChannel);
  }

  if (playerScoreChannel) {
    await supabaseClient.removeChannel(playerScoreChannel);
  }

  // ルーム情報の更新を監視
  playerRoomChannel = supabaseClient
    .channel("player-room-" + playerRoomId)
    .on(
      "postgres_changes",
      {
        event: "UPDATE",
        schema: "public",
        table: "rooms",
        filter: "id=eq." + playerRoomId
      },
      (payload) => {
        updateQuestionScreen(payload.new);
      }
    )
    .subscribe();

  // 自分の得点の更新を監視
  playerScoreChannel = supabaseClient
    .channel("player-score-" + currentPlayerId)
    .on(
      "postgres_changes",
      {
        event: "UPDATE",
        schema: "public",
        table: "players",
        filter: "id=eq." + currentPlayerId
      },
      (payload) => {
        document.getElementById("displayScore").textContent =
          (payload.new.score || 0) + " pts";
      }
    )
    .subscribe();
}

async function loadMyScore() {
  const { data, error } = await supabaseClient
    .from("players")
    .select("score")
    .eq("id", currentPlayerId)
    .single();

  if (error) {
    console.error("得点取得エラー:", error);
    return;
  }

  document.getElementById("displayScore").textContent =
    (data.score || 0) + " pts";
}

// 問題画面を更新
function updateQuestionScreen(room) {
  const questionText = document.getElementById("questionText");
  const questionCategory = document.getElementById("questionCategory");
  const waitingMessage = document.getElementById("waitingMessage");
  const answerArea = document.getElementById("answerArea");
  const buzzerButton = document.getElementById("buzzerButton");
  const turnMessage = document.getElementById("turnMessage");

  // 新しい問題になったら早押し状態をリセット
  if (currentQuestionNumber !== room.current_question_number) {
    currentQuestionNumber = room.current_question_number;
    myBuzzOrder = null;
  }

  // ルーム終了時
  if (room.status === "closed") {
    questionCategory.textContent = "GAME OVER";
    questionText.textContent = "このルームは終了しました。";
    waitingMessage.style.display = "none";
    answerArea.style.display = "none";
    turnMessage.style.display = "none";
    return;
  }

  // 問題がまだない場合
  if (!room.current_question_text) {
    questionCategory.textContent = "WAITING FOR QUESTION";
    questionText.textContent = "司会者が問題を選ぶのを待っています。";
    waitingMessage.style.display = "block";
    answerArea.style.display = "none";
    turnMessage.style.display = "none";
    return;
  }

  const category =
    categoryNames[room.current_question_category] || "QUESTION";

  questionCategory.textContent = category;
  questionText.textContent = room.current_question_text;

  const isActive = room.question_status === "active";

  waitingMessage.style.display = isActive ? "none" : "block";
  answerArea.style.display = isActive ? "block" : "none";

  // BUZZERの状態を更新
  if (myBuzzOrder !== null) {
    buzzerButton.disabled = true;
    buzzerButton.textContent = myBuzzOrder + "番目！";
  } else {
    buzzerButton.disabled = !(isActive && room.buzz_open);
    buzzerButton.textContent = "BUZZER !";
  }

  // 自分に回答権があるか確認
  const isMyTurn =
    isActive &&
    currentPlayerId !== null &&
    room.current_answer_player_id === currentPlayerId;

  turnMessage.style.display = isMyTurn ? "block" : "none";
}

// 入室処理
async function joinGame() {
  const playerName = document.getElementById("playerName").value.trim();
  const roomCode = document.getElementById("roomCode").value.trim();

  if (!/^\d{6}$/.test(roomCode)) {
    alert("参加コードは数字6桁で入力してください。");
    return;
  }

  if (!playerName) {
    alert("ニックネームを入力してください。");
    return;
  }

  const button = document.querySelector(".main-button");
  button.disabled = true;
  button.textContent = "JOINING...";

  try {
    const { data: sessionData, error: sessionError } =
      await supabaseClient.auth.getSession();

    if (sessionError) throw sessionError;

    if (!sessionData.session) {
      const { error } =
        await supabaseClient.auth.signInAnonymously();

      if (error) throw error;
    }

    const { data, error } = await supabaseClient.rpc(
      "join_room_with_code",
      {
        p_room_code: roomCode,
        p_nickname: playerName
      }
    );

    if (error) throw error;

    document.getElementById("displayName").textContent = playerName;
    document.getElementById("joinScreen").style.display = "none";
    document.getElementById("gameScreen").style.display = "block";

// 入室情報を保存
localStorage.setItem("know_room_code", roomCode);
localStorage.setItem("know_player_name", playerName);

    await watchRoom(roomCode);

    console.log("入室成功！", data);

  } catch (error) {
    console.error("入室エラー:", error);
    alert(
      "入室できませんでした。\n参加コードを確認してください。\n\n" +
      error.message
    );

  } finally {
    button.disabled = false;
    button.textContent = "JOIN THE GAME →";
  }
}

// JavaScriptの終了
// 再読み込み後に前の部屋へ戻る処理
async function restoreSession() {
  const roomCode = localStorage.getItem("know_room_code");
  const playerName = localStorage.getItem("know_player_name");

  // 保存された情報がなければ何もしない
  if (!roomCode || !playerName) {
    return;
  }

  try {
    const { data: sessionData, error: sessionError } =
      await supabaseClient.auth.getSession();

    if (sessionError) throw sessionError;

    // ログイン状態がなければ匿名ログイン
    if (!sessionData.session) {
      const { error } =
        await supabaseClient.auth.signInAnonymously();

      if (error) throw error;
    }

    // 保存された情報で部屋に再参加
    const { error } = await supabaseClient.rpc(
      "join_room_with_code",
      {
        p_room_code: roomCode,
        p_nickname: playerName
      }
    );

    if (error) throw error;

    // 画面をゲーム画面に切り替える
    document.getElementById("displayName").textContent = playerName;
    document.getElementById("joinScreen").style.display = "none";
    document.getElementById("gameScreen").style.display = "block";

    // 部屋の最新情報を取得する
    await watchRoom(roomCode);

    console.log("前の部屋への復帰に成功しました！");

  } catch (error) {
    console.error("復帰エラー:", error);
  }
}

// 別のルームに参加する
function resetRoom() {
  if (!confirm("今のルームから退出して、新しいルームに参加しますか？")) {
    return;
  }

  // 保存した参加情報を削除
  localStorage.removeItem("know_room_code");
  localStorage.removeItem("know_player_name");

  // ルームの監視を停止
  if (playerRoomChannel) {
    supabaseClient.removeChannel(playerRoomChannel);
    playerRoomChannel = null;
  }

  // 参加情報をリセット
  playerRoomId = null;

  // 入力画面に戻す
  document.getElementById("gameScreen").style.display = "none";
  document.getElementById("joinScreen").style.display = "block";

  // 入力欄を空にする
  document.getElementById("roomCode").value = "";
  document.getElementById("playerName").value = "";
}

// ページを開いたときに復帰処理を実行
restoreSession();
</script>

</body>
</html>
