
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KNOW. - Player</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px 10px;
  background-color: #009D4E;
  background-image:
    linear-gradient(to right, rgba(255,255,255,0.15) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,0.15) 1px, transparent 1px);
  background-size: 60px 60px;
  color: #1a1a1a;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.container {
  max-width: 600px;
  margin: 0 auto;
  background: #fcfbf9;
  border: 2px solid #1a1a1a;
  border-radius: 4px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.15);
  overflow: hidden;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px;
  border-bottom: 2px solid #1a1a1a;
  background: #fff;
  gap: 10px;
}

header img {
  width: 120px;
  max-width: 100%;
  height: auto;
}

header p {
  margin: 0;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.08em;
}

main {
  padding: 20px;
}

.content-divider {
  display: flex;
  align-items: center;
  margin: 15px 0 25px;
}

.content-divider::before,
.content-divider::after {
  content: "";
  flex: 1;
  border-bottom: 2px solid #1a1a1a;
}

.content-badge {
  padding: 7px 20px;
  border: 2px solid #1a1a1a;
  border-radius: 50px;
  background: #fff;
  font-size: 0.8rem;
  font-weight: 800;
  letter-spacing: 0.12em;
}

.label {
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.1em;
  margin-bottom: 8px;
}

input {
  width: 100%;
  padding: 14px;
  border: 2px solid #1a1a1a;
  border-radius: 2px;
  background: #fff;
  font-size: 1rem;
  margin-bottom: 18px;
}

button {
  cursor: pointer;
  font-family: inherit;
}

.main-button {
  width: 100%;
  padding: 15px;
  border: 2px solid #1a1a1a;
  background: #009D4E;
  color: #fff;
  font-size: 1rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  box-shadow: 0 4px 0 #1a1a1a;
}

.main-button:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 #1a1a1a;
}

.note {
  margin-top: 20px;
  font-size: 0.75rem;
  color: #777;
  line-height: 1.6;
  text-align: center;
}

#gameScreen {
  display: none;
}

.player-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  background: #1a1a1a;
  color: #fff;
  padding: 15px;
  margin-bottom: 20px;
}

.player-info small {
  color: #aaa;
  display: block;
  font-size: 0.7rem;
  letter-spacing: 0.1em;
}

.player-info strong {
  font-size: 1.3rem;
}

.score {
  color: #ffd166;
  font-family: monospace;
  font-size: 1.5rem;
}

.question-box {
  border: 2px solid #1a1a1a;
  background: #fff;
  padding: 20px;
  text-align: center;
  margin-bottom: 20px;
}

.question-box small {
  font-weight: 800;
  letter-spacing: 0.12em;
  color: #777;
}

.question-box h2 {
  font-size: 1.2rem;
  line-height: 1.6;
  margin: 15px 0 5px;
}

.waiting {
  padding: 25px 15px;
  background: #eeece7;
  border: 1px dashed #aaa;
  text-align: center;
  line-height: 1.7;
  font-size: 0.9rem;
}

.waiting strong {
  display: block;
  font-size: 1.1rem;
  margin-bottom: 8px;
}

.buzzer {
  width: 100%;
  padding: 22px 10px;
  border: 3px solid #1a1a1a;
  border-radius: 3px;
  background: #d90429;
  color: #fff;
  font-size: 1.4rem;
  font-weight: 900;
  letter-spacing: 0.1em;
}

.buzzer:disabled {
  background: #aaa;
  border-color: #888;
  cursor: default;
}

.choices {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 15px;
}

.choice {
  padding: 16px 8px;
  border: 2px solid #1a1a1a;
  background: #fff;
  font-size: 0.95rem;
  font-weight: 700;
}

.choice:disabled {
  opacity: 0.5;
  cursor: default;
}

footer {
  padding: 15px;
  border-top: 2px solid #1a1a1a;
  text-align: center;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.1em;
}

@media (max-width: 400px) {
  header img {
    width: 100px;
  }

  header p {
    font-size: 0.65rem;
  }

  main {
    padding: 15px;
  }
}
</style>
</head>

<body>

<div class="container">

  <header>
    <img src="titlelogo_black_nyan.png" alt="KNOW.">
    <p>I KNOW. DO YOU?</p>
  </header>

  <main>

    <!-- 入室画面 -->
    <section id="joinScreen">

      <div class="content-divider">
        <span class="content-badge">PLAYER ENTRY</span>
      </div>

<p class="label">ROOM CODE / 参加コード</p>
<input
  id="roomCode"
  type="text"
  placeholder="参加コードを入力してください"
>
      <p class="label">YOUR NAME / ニックネーム</p>
      <input
        id="playerName"
        type="text"
        placeholder="名前を入力してください"
        maxlength="12"
      >

      <button class="main-button" onclick="joinGame()">
        JOIN THE GAME →
      </button>

      <p class="note">
        司会者から共有されたURLを開いて参加しよう。<br>
        ニックネームは12文字以内で入力できます。
      </p>

    </section>

    <!-- ゲーム画面 -->
    <section id="gameScreen">

      <div class="content-divider">
        <span class="content-badge">PLAYER ROOM</span>
      </div>

      <div class="player-info">
        <div>
          <small>PLAYER</small>
          <strong id="displayName">PLAYER</strong>
        </div>
        <div style="text-align:right;">
          <small>YOUR SCORE</small>
          <strong class="score" id="displayScore">0 pts</strong>
        </div>
      </div>

      <div class="question-box">
        <small id="questionCategory">WAITING FOR QUESTION</small>
        <h2 id="questionText">
          司会者が問題を選ぶのを待っています。
        </h2>
      </div>

      <div class="waiting" id="waitingMessage">
        <strong>STAY TUNED!</strong>
        次の問題が出題されるまで<br>
        しばらくお待ちください。
      </div>

      <div id="answerArea" style="display:none;">

        <button class="buzzer" id="buzzerButton" disabled>
          BUZZER !
        </button>

        <div class="choices">
          <button class="choice" disabled>CHOICE A</button>
          <button class="choice" disabled>CHOICE B</button>
          <button class="choice" disabled>CHOICE C</button>
          <button class="choice" disabled>CHOICE D</button>
        </div>

      </div>

      <p class="note">
        ※ 現在は画面確認用です。<br>
        司会者との連動機能はこれから追加します。
      </p>

    </section>

  </main>

  <footer>
    KNOW. QUIZ PROJECT
  </footer>

</div>

<script>
// Supabase接続設定
const SUPABASE_URL = "https://jdzrpditjbcnbavpadjp.supabase.co";

// 司会者ページと同じ公開用キーを設定
const SUPABASE_KEY = "sb_publishable_9GfTenwqD00b3hU4aBm3Mg_T2t8R6hC";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

// 現在参加しているルーム
let playerRoomId = null;

// ルームの更新を監視するチャンネル
let playerRoomChannel = null;

// ジャンル名を日本語に変換
const categoryNames = {
  language: "文学",
  trivia: "雑学",
  culture: "文化・芸術",
  anime: "アニメ",
  net: "ネットスラング"
};

// 参加中のルーム情報を取得
async function watchRoom(roomCode) {
  const { data: room, error } = await supabaseClient
    .from("rooms")
    .select("id, current_question_text, current_question_category, current_points, question_status, buzz_open")
    .eq("room_key", roomCode)
    .single();

  if (error) {
    console.error("ルーム情報取得エラー:", error);
    alert("ルーム情報を取得できませんでした。");
    return;
  }

  playerRoomId = room.id;

  // 現在の問題を画面に表示
  updateQuestionScreen(room);

  // 以前の監視があれば終了
  if (playerRoomChannel) {
    await supabaseClient.removeChannel(playerRoomChannel);
  }

  // ルーム情報の変更をリアルタイムで監視
  playerRoomChannel = supabaseClient
    .channel("player-room-" + playerRoomId)
    .on(
      "postgres_changes",
      {
        event: "UPDATE",
        schema: "public",
        table: "rooms",
        filter: "id=eq." + playerRoomId
      },
      (payload) => {
        updateQuestionScreen(payload.new);
      }
    )
    .subscribe();
}

// 問題画面を書き換える
function updateQuestionScreen(room) {
  const questionText = document.getElementById("questionText");
  const questionCategory = document.getElementById("questionCategory");
  const waitingMessage = document.getElementById("waitingMessage");
  const answerArea = document.getElementById("answerArea");
  const buzzerButton = document.getElementById("buzzerButton");

  if (!room.current_question_text) {
    questionCategory.textContent = "WAITING FOR QUESTION";
    questionText.textContent = "司会者が問題を選ぶのを待っています。";
    waitingMessage.style.display = "block";
    answerArea.style.display = "none";
    return;
  }

  const category =
    categoryNames[room.current_question_category] || "QUESTION";

  questionCategory.textContent =
    category + " / " + room.current_points + " POINTS";

  questionText.textContent = room.current_question_text;

  waitingMessage.style.display = "block";
  answerArea.style.display = "none";
  buzzerButton.disabled = true;
}

// 入室処理
async function joinGame() {
  const playerName = document.getElementById("playerName").value.trim();
  const roomCode = document.getElementById("roomCode").value.trim();

  if (!roomCode) {
    alert("参加コードを入力してください。");
    return;
  }

  if (!playerName) {
    alert("ニックネームを入力してください。");
    return;
  }

  const button = document.querySelector(".main-button");
  button.disabled = true;
  button.textContent = "JOINING...";

  try {
    // 匿名ログイン
    const { data: sessionData, error: sessionError } =
      await supabaseClient.auth.getSession();

    if (sessionError) throw sessionError;

    if (!sessionData.session) {
      const { error } =
        await supabaseClient.auth.signInAnonymously();

      if (error) throw error;
    }

    // 参加コードを使ってルームに入室
    const { data, error } = await supabaseClient.rpc(
      "join_room",
      {
        p_room_key: roomCode,
        p_nickname: playerName
      }
    );

    if (error) throw error;

    // 入室成功
    document.getElementById("displayName").textContent = playerName;
    document.getElementById("joinScreen").style.display = "none";
    document.getElementById("gameScreen").style.display = "block";
watchRoom(roomCode);

    console.log("入室成功！", data);

  } catch (error) {
    console.error("入室エラー:", error);
    alert("入室できませんでした。\n参加コードを確認してください。\n\n" + error.message);

  } finally {
    button.disabled = false;
    button.textContent = "JOIN THE GAME →";
  }
}
</script>

</body>
</html>
