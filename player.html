
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KNOW. - Player</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px 10px;
  background-color: #009D4E;
  background-image:
    linear-gradient(to right, rgba(255,255,255,0.15) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,0.15) 1px, transparent 1px);
  background-size: 60px 60px;
  color: #1a1a1a;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.container {
  max-width: 600px;
  margin: 0 auto;
  background: #fcfbf9;
  border: 2px solid #1a1a1a;
  border-radius: 4px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.15);
  overflow: hidden;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px;
  border-bottom: 2px solid #1a1a1a;
  background: #fff;
  gap: 10px;
}

header img {
  width: 120px;
  max-width: 100%;
  height: auto;
}

header p {
  margin: 0;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.08em;
}

main {
  padding: 20px;
}

.content-divider {
  display: flex;
  align-items: center;
  margin: 15px 0 25px;
}

.content-divider::before,
.content-divider::after {
  content: "";
  flex: 1;
  border-bottom: 2px solid #1a1a1a;
}

.content-badge {
  padding: 7px 20px;
  border: 2px solid #1a1a1a;
  border-radius: 50px;
  background: #fff;
  font-size: 0.8rem;
  font-weight: 800;
  letter-spacing: 0.12em;
}

.label {
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.1em;
  margin-bottom: 8px;
}

input {
  width: 100%;
  padding: 14px;
  border: 2px solid #1a1a1a;
  border-radius: 2px;
  background: #fff;
  font-size: 1rem;
  margin-bottom: 18px;
}

button {
  cursor: pointer;
  font-family: inherit;
}

.main-button {
  width: 100%;
  padding: 15px;
  border: 2px solid #1a1a1a;
  background: #009D4E;
  color: #fff;
  font-size: 1rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  box-shadow: 0 4px 0 #1a1a1a;
}

.main-button:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 #1a1a1a;
}

.note {
  margin-top: 20px;
  font-size: 0.75rem;
  color: #777;
  line-height: 1.6;
  text-align: center;
}

#gameScreen {
  display: none;
}

.player-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  background: #1a1a1a;
  color: #fff;
  padding: 15px;
  margin-bottom: 20px;
}

.player-info small {
  color: #aaa;
  display: block;
  font-size: 0.7rem;
  letter-spacing: 0.1em;
}

.player-info strong {
  font-size: 1.3rem;
}

.score {
  color: #ffd166;
  font-family: monospace;
  font-size: 1.5rem;
}

.question-box {
  border: 2px solid #1a1a1a;
  background: #fff;
  padding: 20px;
  text-align: center;
  margin-bottom: 20px;
}

.question-box small {
  font-weight: 800;
  letter-spacing: 0.12em;
  color: #777;
}

.question-box h2 {
  font-size: 1.2rem;
  line-height: 1.6;
  margin: 15px 0 5px;
}

.waiting {
  padding: 25px 15px;
  background: #eeece7;
  border: 1px dashed #aaa;
  text-align: center;
  line-height: 1.7;
  font-size: 0.9rem;
}

.waiting strong {
  display: block;
  font-size: 1.1rem;
  margin-bottom: 8px;
}

.buzzer {
  width: 100%;
  padding: 22px 10px;
  border: 3px solid #1a1a1a;
  border-radius: 3px;
  background: #d90429;
  color: #fff;
  font-size: 1.4rem;
  font-weight: 900;
  letter-spacing: 0.1em;
}

.buzzer:disabled {
  background: #aaa;
  border-color: #888;
  cursor: default;
}

.choices {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 15px;
}

.choice {
  padding: 16px 8px;
  border: 2px solid #1a1a1a;
  background: #fff;
  font-size: 0.95rem;
  font-weight: 700;
}

.choice:disabled {
  opacity: 0.5;
  cursor: default;
}

footer {
  padding: 15px;
  border-top: 2px solid #1a1a1a;
  text-align: center;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.1em;
}

@media (max-width: 400px) {
  header img {
    width: 100px;
  }

  header p {
    font-size: 0.65rem;
  }

  main {
    padding: 15px;
  }
}
</style>
</head>

<body>

<div class="container">

  <header>
    <img src="titlelogo_black_nyan.png" alt="KNOW.">
    <p>I KNOW. DO YOU?</p>
  </header>

  <main>

    <!-- 入室画面 -->
    <section id="joinScreen">

      <div class="content-divider">
        <span class="content-badge">PLAYER ENTRY</span>
      </div>

      <p class="label">YOUR NAME / ニックネーム</p>
      <input
        id="playerName"
        type="text"
        placeholder="名前を入力してください"
        maxlength="12"
      >

      <button class="main-button" onclick="joinGame()">
        JOIN THE GAME →
      </button>

      <p class="note">
        司会者から共有されたURLを開いて参加しよう。<br>
        ニックネームは12文字以内で入力できます。
      </p>

    </section>

    <!-- ゲーム画面 -->
    <section id="gameScreen">

      <div class="content-divider">
        <span class="content-badge">PLAYER ROOM</span>
      </div>

      <div class="player-info">
        <div>
          <small>PLAYER</small>
          <strong id="displayName">PLAYER</strong>
        </div>
        <div style="text-align:right;">
          <small>YOUR SCORE</small>
          <strong class="score" id="displayScore">0 pts</strong>
        </div>
      </div>

      <div class="question-box">
        <small id="questionCategory">WAITING FOR QUESTION</small>
        <h2 id="questionText">
          司会者が問題を選ぶのを待っています。
        </h2>
      </div>

      <div class="waiting" id="waitingMessage">
        <strong>STAY TUNED!</strong>
        次の問題が出題されるまで<br>
        しばらくお待ちください。
      </div>

      <div id="answerArea" style="display:none;">

        <button class="buzzer" id="buzzerButton" disabled>
          BUZZER !
        </button>

        <div class="choices">
          <button class="choice" disabled>CHOICE A</button>
          <button class="choice" disabled>CHOICE B</button>
          <button class="choice" disabled>CHOICE C</button>
          <button class="choice" disabled>CHOICE D</button>
        </div>

      </div>

      <p class="note">
        ※ 現在は画面確認用です。<br>
        司会者との連動機能はこれから追加します。
      </p>

    </section>

  </main>

  <footer>
    KNOW. QUIZ PROJECT
  </footer>

</div>

<script>
function joinGame() {
  const playerName = document.getElementById("playerName").value.trim();

  if (!playerName) {
    alert("ニックネームを入力してください。");
    return;
  }

  document.getElementById("displayName").textContent = playerName;
  document.getElementById("joinScreen").style.display = "none";
  document.getElementById("gameScreen").style.display = "block";
}
</script>

</body>
</html>
