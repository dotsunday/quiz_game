<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KNOW. - Host Control Panel</title>
<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px 10px;
  background-color: #009D4E;
  background-size: 60px 60px;
  background-image: 
    linear-gradient(to right, rgba(255, 255, 255, 0.15) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255, 255, 255, 0.15) 1px, transparent 1px);
  color: #1a1a1a;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

/* メインコンテナ */
.container {
  max-width: 900px;
  margin: 0 auto;
  background: #fcfbf9;
  border-radius: 4px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.15);
  overflow: hidden;
  border: 2px solid #1a1a1a;
}

/* ヘッダー：左端に画像ロゴ、右端にテキストサブタイトル */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px;
  border-bottom: 2px solid #1a1a1a;
  background: #fff;
}

h1 {
  margin: 0;
  display: flex;
  align-items: center;
}

h1 img {
  max-width: 140px;
  height: auto;
  display: block;
}

header p {
  margin: 0;
  font-size: 0.8rem;
  letter-spacing: 0.05em;
  color: #1a1a1a;
  font-weight: 700;
}

/* コントロール全体レイアウト */
.panel-body {
  padding: 20px;
}

/* 添付画像のピル型＋両サイドライン装飾（CONTENTS用） */
.content-divider {
  display: flex;
  align-items: center;
  text-align: center;
  margin: 25px 0 20px 0;
}

.content-divider::before,
.content-divider::after {
  content: "";
  flex: 1;
  border-bottom: 2px solid #1a1a1a;
}

.content-badge {
  display: inline-block;
  padding: 8px 24px;
  border: 2px solid #1a1a1a;
  border-radius: 50px;
  background: #fff;
  color: #1a1a1a;
  font-size: 0.85rem;
  font-weight: 800;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin: 0px;
  box-shadow: 0 2px 0 #1a1a1a;
}

.section-title {
  font-size: 0.85rem;
  font-weight: 700;
  color: #1a1a1a;
  margin-bottom: 10px;
  letter-spacing: 0.2em;
}

/* スコア表示エリア */
.score-box {
  background: #F18F50;
  color: #fff;
  padding: 15px 20px;
  border-radius: 2px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.score-box span {
  font-size: 0.8rem;
  letter-spacing: 0.1em;
  color: #aaa;
  text-transform: uppercase;
}

.score-box strong {
  font-size: 2.2rem;
  color: #ffffff;
  font-family: monospace;
}

/* ランキングスコアボード */
.leaderboard {
  background: #1a1a1a;
  color: #fff;
  padding: 18px;
  margin-bottom: 20px;
  border: 2px solid #1a1a1a;
}

.leaderboard-header {
  display: flex;
  justify-content: space-between;
  font-size: 0.8rem;
  font-weight: 800;
  letter-spacing: 0.18em;
  color: #F18F50;
  padding-bottom: 12px;
  border-bottom: 1px solid #555;
}

.leaderboard-columns,
.ranking-row {
  display: grid;
  grid-template-columns: 55px 1fr 85px;
  align-items: center;
  gap: 8px;
}

.leaderboard-columns {
  padding: 12px 5px 8px;
  color: #999;
  font-size: 0.7rem;
  letter-spacing: 0.1em;
}

.ranking-row {
  padding: 13px 5px;
  border-top: 1px solid #444;
}

.ranking-number {
  color: #F18F50;
  font-size: 1.1rem;
  font-weight: 800;
  font-family: monospace;
}

.ranking-name {
  font-size: 0.95rem;
  font-weight: 700;
  overflow-wrap: anywhere;
}

.ranking-score {
  text-align: right;
  color: #fff;
  font-size: 1.2rem;
  font-weight: 800;
  font-family: monospace;
}

.ranking-empty {
  padding: 25px 5px;
  text-align: center;
  color: #aaa;
  font-size: 0.85rem;
}

/* 問題ボードのグリッド */
/* ジャンルごとの問題ボード */
.board-group {
  margin-bottom: 25px;
  padding-bottom: 25px;
  border-bottom: 2px dashed #999;
}

/* 最後のジャンルには区切り線をつけない */
.board-group:last-child {
  border-bottom: none;
}

.board {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

/* タイルデザイン（数字のみでスッキリと） */
.tile {
  background: #fff;
  color: #1a1a1a;
  border: 2px solid #1a1a1a;
  border-radius: 50px;
  padding: 16px 5px;
  font-size: 1.2rem;
  font-weight: 800;
  font-family: monospace;
  cursor: pointer;
  transition: all 0.15s ease;
  text-align: center;
}

.tile:hover:not(:disabled) {
  background: #1a1a1a;
  color: #fff;
}

.tile:disabled {
  background: #e0deda;
  color: #888;
  border-color: #ccc;
  cursor: default;
  font-family: inherit;
  font-size: 1.1rem;
}

/* モーダル */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(26,26,26,0.8);
  justify-content: center;
  align-items: center;
  padding: 15px;
  backdrop-filter: blur(4px);
}

.modal-content {
  background: #fcfbf9;
  border: 2px solid #1a1a1a;
  border-radius: 4px;
  padding: 25px;
  width: 100%;
  max-width: 480px;
  box-shadow: 0 15px 30px rgba(0,0,0,0.3);
}

.modal-content h2 {
  margin-top: 0;
  font-size: 1rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: #666;
  border-bottom: 1px solid #ddd;
  padding-bottom: 8px;
}

.question {
  font-size: 1.2rem;
  margin: 20px 0;
  font-weight: 700;
  line-height: 1.4;
}

.answer {
  display: none;
  background: #fff;
  border-left: 4px solid #009D4E;
  padding: 12px;
  font-size: 1.1rem;
  margin: 15px 0;
  font-weight: bold;
}

/* アクションボタン */
.btn-row {
  display: flex;
  gap: 8px;
  margin-top: 15px;
}

.action {
  flex: 1;
  border: 2px solid #1a1a1a;
  border-radius: 2px;
  padding: 12px 8px;
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  text-transform: uppercase;
}

.reveal { background: #fff; color: #1a1a1a; }
.correct { background: #009D4E; color: #fff; }
.wrong { background: #d90429; color: #fff; }
.close-btn { background: #1a1a1a; color: #fff; width: 100%; margin-top: 12px; }

.reset-container {
  text-align: center;
  margin-top: 30px;
  border-top: 1px solid #ddd;
  padding-top: 20px;
}

.reset {
  background: transparent;
  color: #666;
  border: 2px solid #ccc;
  border-radius: 2px;
  padding: 8px 16px;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
}

#closeRoomButton {
  display: block;
  width: fit-content;
  margin: 18px auto 0;
  padding: 6px 14px;
  background: transparent;
  color: #666;
  border: 2px solid #ccc;
  border-radius: 2px;
  font-size: 0.75rem;
  font-weight: 600;
  cursor: pointer;
}
  /* ルーム作成エリア */
.room-box {
  background: #fff;
  border: 2px solid #1a1a1a;
  padding: 15px;
  margin-bottom: 20px;
  text-align: center;
}

.room-title {
  font-size: 0.85rem;
  font-weight: 800;
  letter-spacing: 0.1em;
  margin-bottom: 10px;
}

.room-button {
  width: 100%;
  background: #009D4E;
  color: #fff;
  border: 2px solid #1a1a1a;
  padding: 13px;
  font-size: 1rem;
  font-weight: 800;
  cursor: pointer;
}

.room-button:disabled {
  opacity: 0.6;
  cursor: default;
}

.room-info {
  margin-top: 12px;
  font-size: 0.9rem;
  font-weight: 700;
  overflow-wrap: anywhere;
}

.tile .level-label {
  font-size: 0.65em;
  font-weight: normal;
}

.tile .level-number {
  font-size: 1.2em;
  font-weight: bold;
}

<script>
  // Supabase接続設定
const SUPABASE_URL = "https://jdzrpditjbcnbavpadjp.supabase.co";
const SUPABASE_KEY = "sb_publishable_9GfTenwqD00b3hU4aBm3Mg_T2t8R6hC";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

// 匿名ログイン
async function connectSupabase() {
  const { data: sessionData, error: sessionError } =
    await supabaseClient.auth.getSession();

  if (sessionError) {
    console.error(sessionError);
    return;
  }

  if (!sessionData.session) {
    const { error } =
      await supabaseClient.auth.signInAnonymously();

    if (error) {
      console.error(error);
      return;
    }
  }

  console.log("Supabase接続準備OK！");
}

const supabaseReady = connectSupabase();

// 現在のルーム情報
let currentRoomId = null;
let currentRoomKey = null;
// 保存されたルーム情報を復元
async function restoreHostRoom() {
  const savedRoomId = localStorage.getItem("know_host_room_id");
  const savedRoomCode = localStorage.getItem("know_host_room_code");

  // 保存情報がなければ何もしない
  if (!savedRoomId || !savedRoomCode) {
    return;
  }

  try {
    await supabaseReady;

    // ログイン状態を確認
    const { data: sessionData, error: sessionError } =
      await supabaseClient.auth.getSession();

    if (sessionError) throw sessionError;

    if (!sessionData.session) {
      console.log("司会者のログイン情報がありません");
      return;
    }

    // 自分が作ったルームか確認
    const { data: room, error } = await supabaseClient
      .from("rooms")
      .select("id, room_code")
      .eq("id", savedRoomId)
      .single();

    if (error) throw error;

    if (!room || room.room_code !== savedRoomCode) {
      throw new Error("保存されたルーム情報と一致しません");
    }

    // ルーム情報を復元
    currentRoomId = room.id;
    currentRoomKey = room.room_code;

    // 参加コードを画面に表示
    document.getElementById("roomInfo").textContent =
      "参加コード：" + currentRoomKey;

    const button = document.getElementById("createRoomButton");
    button.textContent = "ルーム作成済み";
    button.disabled = true;

document.getElementById("closeRoomButton").style.display = "block";

    // スコアボードを再開
    startScoreboard();

    console.log("司会者のルーム復元に成功しました！");

  } catch (error) {
    console.error("司会者のルーム復元エラー:", error);
  }
}

// ランキング更新用
let rankingChannel = null;
let buzzChannel = null;

// ルームを閉じる
async function closeRoom() {
  if (!currentRoomId) {
    alert("ルームIDが取得できていません！");
    return;
  }

  if (!confirm("ルームを閉じますか？参加者もゲームに参加できなくなります。")) {
    return;
  }

  const button = document.getElementById("closeRoomButton");
  button.disabled = true;
  button.textContent = "終了処理中...";

  try {
    await supabaseReady;

    const { error } = await supabaseClient.rpc("host_close_room", {
      p_room_id: currentRoomId
    });

    if (error) throw error;

    // リアルタイム監視を終了
    if (rankingChannel) {
      await supabaseClient.removeChannel(rankingChannel);
      rankingChannel = null;
    }

    if (buzzChannel) {
      await supabaseClient.removeChannel(buzzChannel);
      buzzChannel = null;
    }

    // 保存していたルーム情報を削除
    localStorage.removeItem("know_host_room_id");
    localStorage.removeItem("know_host_room_code");

    // 司会者側のルーム情報をリセット
    currentRoomId = null;
    currentRoomKey = null;

    document.getElementById("roomInfo").textContent =
      "まだルームは作成されていません";

    document.getElementById("createRoomButton").textContent =
      "ルームを作成";
    document.getElementById("createRoomButton").disabled = false;

    button.style.display = "none";
    button.disabled = false;
    button.textContent = "ルームを閉じる";

    document.getElementById("rankingList").innerHTML =
      '<div class="ranking-empty">参加者の入室を待っています</div>';

    alert("ルームを閉じました！");

  } catch (error) {
    console.error("ルーム終了エラー:", error);
    alert("ルームを閉じられませんでした：" + error.message);

    button.disabled = false;
    button.textContent = "ルームを閉じる";
  }
}

// 参加者のランキングを取得
async function loadPlayers() {
  if (!currentRoomId) return;

  const { data, error } = await supabaseClient
    .from("players")
    .select("id, nickname, score")
    .eq("room_id", currentRoomId)
    .order("score", { ascending: false });

  if (error) {
    console.error("ランキング取得エラー:", error);
    return;
  }

  const rankingList = document.getElementById("rankingList");
  rankingList.innerHTML = "";

  if (!data || data.length === 0) {
    rankingList.innerHTML =
      '<div class="ranking-empty">参加者の入室を待っています</div>';
    return;
  }

  let previousScore = null;
  let previousRank = 0;

  data.forEach((player, index) => {
    const rank =
      player.score === previousScore ? previousRank : index + 1;

    previousScore = player.score;
    previousRank = rank;

    const row = document.createElement("div");
    row.className = "ranking-row";

    const rankElement = document.createElement("span");
    rankElement.className = "ranking-number";
    rankElement.textContent = String(rank).padStart(2, "0");

    const nameElement = document.createElement("span");
    nameElement.className = "ranking-name";
    nameElement.textContent = player.nickname;

    const scoreElement = document.createElement("span");
    scoreElement.className = "ranking-score";
    scoreElement.textContent = player.score + " pt";

    row.appendChild(rankElement);
    row.appendChild(nameElement);
    row.appendChild(scoreElement);

    rankingList.appendChild(row);
  });
}

// 早押しした参加者の一覧を取得
async function loadBuzzList() {
  if (!currentRoomId) return;

  const buzzList = document.getElementById("buzzList");

  const { data: room, error: roomError } = await supabaseClient
    .from("rooms")
    .select("current_question_number, current_answer_player_id, current_turn_index")
    .eq("id", currentRoomId)
    .single();

  if (roomError) {
    console.error("ルーム情報取得エラー:", roomError);
    return;
  }

  const { data, error } = await supabaseClient
    .from("answers")
    .select("player_id, buzz_order")
    .eq("room_id", currentRoomId)
    .eq("question_number", room.current_question_number)
    .order("buzz_order", { ascending: true });

  if (error) {
    console.error("早押し取得エラー:", error);
    return;
  }

  const { data: players, error: playerError } = await supabaseClient
    .from("players")
    .select("id, nickname")
    .eq("room_id", currentRoomId);

  if (playerError) {
    console.error("参加者取得エラー:", playerError);
    return;
  }

  buzzList.innerHTML = "";

  if (!data || data.length === 0) {
    buzzList.textContent = "早押し受付を待っています";
    return;
  }

  // まだ回答権が設定されていなければ、1番目の人に設定
  if (room.current_answer_player_id === null) {
    const firstPlayerId = data[0].player_id;

    const { error: updateError } = await supabaseClient
      .from("rooms")
      .update({
        current_answer_player_id: firstPlayerId,
        current_turn_index: 0
      })
      .eq("id", currentRoomId);

    if (updateError) {
      console.error("最初の回答権設定エラー:", updateError);
    }
  }

  // 早押し順を表示
  data.forEach((answer) => {
    const player = players.find(p => p.id === answer.player_id);
    if (!player) return;

    const row = document.createElement("div");
    row.textContent =
      answer.buzz_order + "番目：" + player.nickname;

    buzzList.appendChild(row);
  });
}

// 参加者の入室・得点変更・早押しを監視
function startScoreboard() {
  if (!currentRoomId) return;

  if (rankingChannel) {
    supabaseClient.removeChannel(rankingChannel);
  }

  if (buzzChannel) {
    supabaseClient.removeChannel(buzzChannel);
  }

  loadPlayers();
  loadBuzzList();

  rankingChannel = supabaseClient
    .channel("ranking-" + currentRoomId)
    .on(
      "postgres_changes",
      {
        event: "*",
        schema: "public",
        table: "players",
        filter: "room_id=eq." + currentRoomId
      },
      () => {
        loadPlayers();
      }
    )
    .subscribe();

  buzzChannel = supabaseClient
    .channel("buzz-" + currentRoomId)
    .on(
      "postgres_changes",
      {
        event: "INSERT",
        schema: "public",
        table: "answers",
        filter: "room_id=eq." + currentRoomId
      },
      () => {
        loadBuzzList();
      }
    )
    .subscribe();
}

// ルーム作成
async function createRoom() {
  const button = document.getElementById("createRoomButton");
  const info = document.getElementById("roomInfo");

  if (!button || !info) {
    console.error("要素が見つかりません");
    return;
  }

  button.disabled = true;
  button.textContent = "作成中...";
  info.textContent = "接続しています...";

  try {
    // Supabaseへの接続完了を待つ
    await supabaseReady;

    // 6桁コードでルームを作成
    const { data, error } =
      await supabaseClient.rpc("host_create_room_with_code");

    if (error) throw error;

    const room = Array.isArray(data) ? data[0] : data;

    if (!room || !room.created_room_code) {
      throw new Error("ルーム情報を取得できませんでした");
    }

    currentRoomId = room.created_room_id;
    currentRoomKey = room.created_room_code;
// 司会者のルーム情報を保存
localStorage.setItem("know_host_room_id", currentRoomId);
localStorage.setItem("know_host_room_code", currentRoomKey);
    startScoreboard();

    // 6桁の参加コードを表示
    info.textContent = "参加コード：" + currentRoomKey;
    button.textContent = "ルーム作成済み";

document.getElementById("closeRoomButton").style.display = "block";

    console.log("ルーム作成成功！", room);

  } catch (error) {

    button.textContent = "ルームを作成";
  }
}

function createBoard() {

async function openQuestion(item, tile) {
  currentQuestion = item;
  currentTile = tile;

  document.getElementById("questionTitle").textContent =
    item.level === "MAX" ? "MAX LEVEL" : "LEVEL " + item.level;

  document.getElementById("question").textContent = item.q;
  document.getElementById("answer").textContent = "正解：" + item.a;
  document.getElementById("answer").style.display = "none";
  document.getElementById("judge").style.display = "none";
  document.getElementById("modal").style.display = "flex";

  if (!currentRoomId) {
    alert("ルームIDが取得できていません！");
    return;
  }

  // 現在の問題番号を取得
  const { data: room, error: roomError } = await supabaseClient
    .from("rooms")
    .select("current_question_number")
    .eq("id", currentRoomId)
    .single();

  if (roomError) {
    alert("ルーム情報を取得できませんでした：" + roomError.message);
    return;
  }

  // 新しい問題として番号を1つ進め、早押し情報をリセット
  const { data, error } = await supabaseClient
    .from("rooms")
    .update({
      current_question_number: room.current_question_number + 1,
      buzz_counter: 0,
      current_answer_player_id: null,
      current_turn_index: 0,
      current_question_text: item.q,
      current_question_category: Object.keys(questions).find(
        category => questions[category].includes(item)
      ),
      current_points: 3,
      question_status: "waiting",
      buzz_open: false
    })
    .eq("id", currentRoomId)
    .select();

  if (error) {
    alert("問題情報を保存できませんでした：" + error.message);
    console.error(error);
    return;
  }

  console.log("新しい問題を保存しました:", data);
}

  }

    return;
  }

  console.log("早押し受付を開始しました！");
  loadBuzzList();
}


async function judge(isCorrect) {
  // 現在の問題情報を取得
  const { data: room, error: roomError } = await supabaseClient
    .from("rooms")
    .select("current_question_number, current_answer_player_id, current_points")
    .eq("id", currentRoomId)
    .single();

  if (roomError) {
    alert("ルーム情報を取得できませんでした：" + roomError.message);
    return;
  }

  // ×を押した場合：次の人に回答権を移す
  if (!isCorrect) {
    const { data, error } = await supabaseClient
      .from("answers")
      .select("player_id, buzz_order")
      .eq("room_id", currentRoomId)
      .eq("question_number", room.current_question_number)
      .order("buzz_order", { ascending: true });

    if (error) {
      alert("早押し順を取得できませんでした：" + error.message);
      return;
    }

    if (!data || data.length === 0) {
      alert("早押しした参加者がいません。");
      return;
    }

    const currentIndex = data.findIndex(
      answer => answer.player_id === room.current_answer_player_id
    );

    if (currentIndex === -1) {
      alert("現在の回答者を確認できませんでした。");
      return;
    }

    const nextIndex = (currentIndex + 1) % data.length;
    const nextPlayerId = data[nextIndex].player_id;

    const { error: updateError } = await supabaseClient
      .from("rooms")
      .update({
        current_answer_player_id: nextPlayerId,
        current_turn_index: nextIndex
      })
      .eq("id", currentRoomId);

    if (updateError) {
      alert("次の回答者に切り替えられませんでした：" + updateError.message);
      return;
    }

    await loadBuzzList();
    return;
  }

  // ○を押した場合：正解した参加者に得点を加算
  if (room.current_answer_player_id === null) {
    alert("正解した参加者を確認できませんでした。");
    return;
  }

  const { data: player, error: playerError } = await supabaseClient
    .from("players")
    .select("score")
    .eq("id", room.current_answer_player_id)
    .single();

  if (playerError) {
    alert("参加者の点数を取得できませんでした：" + playerError.message);
    return;
  }

  const points = room.current_points || 3;

  const { error: scoreError } = await supabaseClient
    .from("players")
    .update({
      score: (player.score || 0) + points
    })
    .eq("id", room.current_answer_player_id);

  if (scoreError) {
    alert("得点を保存できませんでした：" + scoreError.message);
    return;
  }

  // 正解したら早押し受付を終了
  const { error: finishError } = await supabaseClient
    .from("rooms")
    .update({
      buzz_open: false,
      question_status: "finished"
    })
    .eq("id", currentRoomId);

  if (finishError) {
    alert("問題の終了処理に失敗しました：" + finishError.message);
    return;
  }

  currentTile.disabled = true;
  currentTile.textContent = "USED";

  closeModal();
}
