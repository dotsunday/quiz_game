<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KNOW. - Host Control Panel</title>
<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px 10px;
  background-color: #009D4E;
  background-size: 60px 60px;
  background-image: 
    linear-gradient(to right, rgba(255, 255, 255, 0.15) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255, 255, 255, 0.15) 1px, transparent 1px);
  color: #1a1a1a;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

/* メインコンテナ */
.container {
  max-width: 900px;
  margin: 0 auto;
  background: #fcfbf9;
  border-radius: 4px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.15);
  overflow: hidden;
  border: 2px solid #1a1a1a;
}

/* ヘッダー：左端に画像ロゴ、右端にテキストサブタイトル */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px;
  border-bottom: 2px solid #1a1a1a;
  background: #fff;
}

h1 {
  margin: 0;
  display: flex;
  align-items: center;
}

h1 img {
  max-width: 140px;
  height: auto;
  display: block;
}

header p {
  margin: 0;
  font-size: 0.8rem;
  letter-spacing: 0.05em;
  color: #1a1a1a;
  font-weight: 700;
}

/* コントロール全体レイアウト */
.panel-body {
  padding: 20px;
}

/* 添付画像のピル型＋両サイドライン装飾（CONTENTS用） */
.content-divider {
  display: flex;
  align-items: center;
  text-align: center;
  margin: 25px 0 20px 0;
}

.content-divider::before,
.content-divider::after {
  content: "";
  flex: 1;
  border-bottom: 2px solid #1a1a1a;
}

.content-badge {
  display: inline-block;
  padding: 8px 24px;
  border: 2px solid #1a1a1a;
  border-radius: 50px;
  background: #fff;
  color: #1a1a1a;
  font-size: 0.85rem;
  font-weight: 800;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin: 0px;
  box-shadow: 0 2px 0 #1a1a1a;
}

.section-title {
  font-size: 0.85rem;
  font-weight: 700;
  color: #1a1a1a;
  margin-body: 10px;
  margin-bottom: 10px;
}

/* スコア表示エリア */
.score-box {
  background: #1a1a1a;
  color: #fff;
  padding: 15px 20px;
  border-radius: 2px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.score-box span {
  font-size: 0.8rem;
  letter-spacing: 0.1em;
  color: #aaa;
  text-transform: uppercase;
}

.score-box strong {
  font-size: 2.2rem;
  color: #ffd166;
  font-family: monospace;
}

/* 問題ボードのグリッド */
.board-group {
  margin-bottom: 25px;
}

.board {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

/* タイルデザイン（数字のみでスッキリと） */
.tile {
  background: #fff;
  color: #1a1a1a;
  border: 2px solid #1a1a1a;
  border-radius: 2px;
  padding: 16px 5px;
  font-size: 1.2rem;
  font-weight: 800;
  font-family: monospace; /* 数字が綺麗に見えるフォントに */
  cursor: pointer;
  transition: all 0.15s ease;
  text-align: center;
}

.tile:hover:not(:disabled) {
  background: #1a1a1a;
  color: #fff;
}

.tile:disabled {
  background: #e0deda;
  color: #888;
  border-color: #ccc;
  cursor: default;
  font-family: inherit; /* USEDになったら通常の文字に戻す */
  font-size: 1.1rem;
}

/* モーダル */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(26,26,26,0.8);
  justify-content: center;
  align-items: center;
  padding: 15px;
  backdrop-filter: blur(4px);
}

.modal-content {
  background: #fcfbf9;
  border: 2px solid #1a1a1a;
  border-radius: 4px;
  padding: 25px;
  width: 100%;
  max-width: 480px;
  box-shadow: 0 15px 30px rgba(0,0,0,0.3);
}

.modal-content h2 {
  margin-top: 0;
  font-size: 1rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: #666;
  border-bottom: 1px solid #ddd;
  padding-bottom: 8px;
}

.question {
  font-size: 1.2rem;
  margin: 20px 0;
  font-weight: 700;
  line-height: 1.4;
}

.answer {
  display: none;
  background: #fff;
  border-left: 4px solid #009D4E;
  padding: 12px;
  font-size: 1.1rem;
  margin: 15px 0;
  font-weight: bold;
}

/* アクションボタン */
.btn-row {
  display: flex;
  gap: 8px;
  margin-top: 15px;
}

.action {
  flex: 1;
  border: 2px solid #1a1a1a;
  border-radius: 2px;
  padding: 12px 8px;
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  text-transform: uppercase;
}

.reveal { background: #fff; color: #1a1a1a; }
.correct { background: #009D4E; color: #fff; }
.wrong { background: #d90429; color: #fff; }
.close-btn { background: #1a1a1a; color: #fff; width: 100%; margin-top: 12px; }

.reset-container {
  text-align: center;
  margin-top: 30px;
  border-top: 1px solid #ddd;
  padding-top: 20px;
}

.reset {
  background: transparent;
  color: #666;
  border: 2px solid #ccc;
  border-radius: 2px;
  padding: 8px 16px;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="container">
  <header>
    <h1>
      <img src="titlelogo_black_nyan.png" alt="KNOW.">
    </h1>
    <p>I KNOW. DO YOU?</p>
  </header>

  <div class="panel-body">
    <div class="score-box">
      <span>SCORE</span>
      <div><strong id="score">0</strong> <small style="font-size: 0.9rem; color:#aaa;">pts</small></div>
    </div>

    <!-- CONTENTSの大見出し -->
    <div class="content-divider">
      <span class="content-badge">CONTENTS</span>
    </div>

    <div class="board-group">
      <div class="section-title">（ 　文学　 ）</div>
      <div class="board" id="language"></div>
    </div>

    <div class="board-group">
      <div class="section-title">（ 　雑学　 ）</div>
      <div class="board" id="trivia"></div>
    </div>

    <div class="board-group">
      <div class="section-title">（ 　文化・芸術　 ）</div>
      <div class="board" id="culture"></div>
    </div>

     <div class="board-group">
      <div class="section-title">（ 　アニメ　 ）</div>
      <div class="board" id="anime"></div>
    </div>

    <div class="board-group">
      <div class="section-title">（ 　ネットスラング　 ）</div>
      <div class="board" id="net"></div>
    </div>
    
    <div class="reset-container">
      <button class="reset" onclick="resetGame()">RESET</button>
    </div>
  </div>
</div>

<!-- モーダルウィンドウ -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h2 id="questionTitle">QUESTION</h2>
    <div class="question" id="question"></div>

    <button class="action reveal" onclick="showAnswer()" style="width:100%;">
      答え
    </button>

    <div class="answer" id="answer"></div>

    <div id="judge" style="display:none">
      <div class="btn-row">
        <button class="action correct" onclick="judge(true)">正解！ (+Pts)</button>
        <button class="action wrong" onclick="judge(false)">不正解</button>
      </div>
    </div>

    <button class="action close-btn" onclick="closeModal()">
      CLOSE
    </button>
  </div>
</div>

<script>
const questions = {
  language: [
    { point: 10, q: "タコの足は何本？", a: "8本" },
    { point: 20, q: "語源はポルトガル語の「コンフェイト」で、戦国時代に日本へ伝わった、星のような形の砂糖菓子は何？", a: "金平糖" },
    { point: 30, q: "世界で最も面積が大きい国は？", a: "ロシア" },
    { point: 40, q: "（4問目の問題）", a: "（答え）" },
    { point: 50, q: "（5問目の問題）", a: "（答え）" }
  ],
  trivia: [
    { point: 10, q: "日本の首都は？", a: "東京" },
    { point: 20, q: "語源はポルトガル語の「コンフェイト」で、戦国時代に日本へ伝わった、星のような形の砂糖菓子は何？", a: "金平糖" },
    { point: 30, q: "日本で一番高い山は？", a: "富士山" },
    { point: 40, q: "（4問目の問題）", a: "（答え）" },
    { point: 50, q: "（5問目の問題）", a: "（答え）" }
  ],
  culture: [
    { point: 10, q: "タコの足は何本？", a: "8本" },
    { point: 20, q: "語源はポルトガル語の「コンフェイト」で、戦国時代に日本へ伝わった、星のような形の砂糖菓子は何？", a: "金平糖" },
    { point: 30, q: "57577で構成される和歌や短歌のことをその文字数からなんと呼ぶ？", a: "三十一文字(みそひともじ)" },
    { point: 40, q: "（4問目の問題）", a: "（答え）" },
    { point: 50, q: "（5問目の問題）", a: "（答え）" }
  ],
  anime: [
    { point: 10, q: "タコの足は何本？", a: "8本" },
    { point: 20, q: "語源はポルトガル語の「コンフェイト」で、戦国時代に日本へ伝わった、星のような形の砂糖菓子は何？", a: "金平糖" },
    { point: 30, q: "57577で構成される和歌や短歌のことをその文字数からなんと呼ぶ？", a: "三十1文字(みそひともじ)" },
    { point: 40, q: "（4問目の問題）", a: "（答え）" },
    { point: 50, q: "（5問目の問題）", a: "（答え）" }
  ],
  net: [
    { point: 10, q: "タコの足は何本？", a: "8本" },
    { point: 20, q: "語源はポルトガル語の「コンフェイト」で、戦国時代に日本へ伝わった、星のような形の砂糖菓子は何？", a: "金平糖" },
    { point: 30, q: "57577で構成される和歌や短歌のことをその文字数からなんと呼ぶ？", a: "三十一文字(みそひともじ)" },
    { point: 40, q: "（4問目の問題）", a: "（答え）" },
    { point: 50, q: "（5問目の問題）", a: "（答え）" }
  ],
};

let score = 0;
let currentQuestion = null;
let currentTile = null;

function createBoard() {
  for (const category in questions) {
    const board = document.getElementById(category);
    if (!board) continue;
    board.innerHTML = "";

    questions[category].forEach((item) => {
      const button = document.createElement("button");
      button.className = "tile";
      
      // ptsをつけず、数字（例: 10, 20...）だけをそのまま表示
      button.textContent = item.point;
      
      button.onclick = () => {
        openQuestion(item, button);
      };
      board.appendChild(button);
    });
  }
}

function openQuestion(item, tile) {
  currentQuestion = item;
  currentTile = tile;

  document.getElementById("questionTitle").textContent = item.point + " POINTS";
  document.getElementById("question").textContent = item.q;
  document.getElementById("answer").textContent = "正解：" + item.a;
  document.getElementById("answer").style.display = "none";
  document.getElementById("judge").style.display = "none";
  document.getElementById("modal").style.display = "flex";
}

function showAnswer() {
  document.getElementById("answer").style.display = "block";
  document.getElementById("judge").style.display = "block";
}

function judge(isCorrect) {
  if (isCorrect) {
    score += currentQuestion.point;
  }
  document.getElementById("score").textContent = score;
  currentTile.disabled = true;
  currentTile.textContent = "USED";
  closeModal();
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

function resetGame() {
  if (!confirm("最初からやりなおしますか？")) {
    return;
  }
  score = 0;
  document.getElementById("score").textContent = score;
  createBoard();
}

createBoard();
</script>

</body>
</html>
