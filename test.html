<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KNOW. - Host Control Panel</title>
<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px 10px;
  background-color: #009D4E;
  background-size: 60px 60px;
  background-image: 
    linear-gradient(to right, rgba(255, 255, 255, 0.15) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255, 255, 255, 0.15) 1px, transparent 1px);
  color: #1a1a1a;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

/* メインコンテナ */
.container {
  max-width: 900px;
  margin: 0 auto;
  background: #fcfbf9;
  border-radius: 4px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.15);
  overflow: hidden;
  border: 2px solid #1a1a1a;
}

/* ヘッダー：左端に画像ロゴ、右端にテキストサブタイトル */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px;
  border-bottom: 2px solid #1a1a1a;
  background: #fff;
}

h1 {
  margin: 0;
  display: flex;
  align-items: center;
}

h1 img {
  max-width: 140px;
  height: auto;
  display: block;
}

header p {
  margin: 0;
  font-size: 0.8rem;
  letter-spacing: 0.05em;
  color: #1a1a1a;
  font-weight: 700;
}

/* コントロール全体レイアウト */
.panel-body {
  padding: 20px;
}

/* 添付画像のピル型＋両サイドライン装飾（CONTENTS用） */
.content-divider {
  display: flex;
  align-items: center;
  text-align: center;
  margin: 25px 0 20px 0;
}

.content-divider::before,
.content-divider::after {
  content: "";
  flex: 1;
  border-bottom: 2px solid #1a1a1a;
}

.content-badge {
  display: inline-block;
  padding: 8px 24px;
  border: 2px solid #1a1a1a;
  border-radius: 50px;
  background: #fff;
  color: #1a1a1a;
  font-size: 0.85rem;
  font-weight: 800;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin: 0px;
  box-shadow: 0 2px 0 #1a1a1a;
}

.section-title {
  font-size: 0.85rem;
  font-weight: 700;
  color: #1a1a1a;
  margin-body: 10px;
  margin-bottom: 10px;
}

/* スコア表示エリア */
.score-box {
  background: #1a1a1a;
  color: #fff;
  padding: 15px 20px;
  border-radius: 2px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.score-box span {
  font-size: 0.8rem;
  letter-spacing: 0.1em;
  color: #aaa;
  text-transform: uppercase;
}

.score-box strong {
  font-size: 2.2rem;
  color: #ffd166;
  font-family: monospace;
}

/* 問題ボードのグリッド */
.board-group {
  margin-bottom: 25px;
}

.board {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

/* タイルデザイン（数字のみでスッキリと） */
.tile {
  background: #fff;
  color: #1a1a1a;
  border: 2px solid #1a1a1a;
  border-radius: 2px;
  padding: 16px 5px;
  font-size: 1.2rem;
  font-weight: 800;
  font-family: monospace; /* 数字が綺麗に見えるフォントに */
  cursor: pointer;
  transition: all 0.15s ease;
  text-align: center;
}

.tile:hover:not(:disabled) {
  background: #1a1a1a;
  color: #fff;
}

.tile:disabled {
  background: #e0deda;
  color: #888;
  border-color: #ccc;
  cursor: default;
  font-family: inherit; /* USEDになったら通常の文字に戻す */
  font-size: 1.1rem;
}

/* モーダル */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(26,26,26,0.8);
  justify-content: center;
  align-items: center;
  padding: 15px;
  backdrop-filter: blur(4px);
}

.modal-content {
  background: #fcfbf9;
  border: 2px solid #1a1a1a;
  border-radius: 4px;
  padding: 25px;
  width: 100%;
  max-width: 480px;
  box-shadow: 0 15px 30px rgba(0,0,0,0.3);
}

.modal-content h2 {
  margin-top: 0;
  font-size: 1rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: #666;
  border-bottom: 1px solid #ddd;
  padding-bottom: 8px;
}

.question {
  font-size: 1.2rem;
  margin: 20px 0;
  font-weight: 700;
  line-height: 1.4;
}

.answer {
  display: none;
  background: #fff;
  border-left: 4px solid #009D4E;
  padding: 12px;
  font-size: 1.1rem;
  margin: 15px 0;
  font-weight: bold;
}

/* アクションボタン */
.btn-row {
  display: flex;
  gap: 8px;
  margin-top: 15px;
}

.action {
  flex: 1;
  border: 2px solid #1a1a1a;
  border-radius: 2px;
  padding: 12px 8px;
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  text-transform: uppercase;
}

.reveal { background: #fff; color: #1a1a1a; }
.correct { background: #009D4E; color: #fff; }
.wrong { background: #d90429; color: #fff; }
.close-btn { background: #1a1a1a; color: #fff; width: 100%; margin-top: 12px; }

.reset-container {
  text-align: center;
  margin-top: 30px;
  border-top: 1px solid #ddd;
  padding-top: 20px;
}

.reset {
  background: transparent;
  color: #666;
  border: 2px solid #ccc;
  border-radius: 2px;
  padding: 8px 16px;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="container">
  <header>
    <h1>
      <img src="titlelogo_black_nyan.png" alt="KNOW.">
    </h1>
    <p>I KNOW. DO YOU?</p>
